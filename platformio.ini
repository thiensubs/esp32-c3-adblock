[platformio]
default_envs = c3

[env]
; Deliberately NOT pinned to a platform zip: our branch keeps the stock PlatformIO
; channel and the diff minimal. (Upstream main pins a zip + core 3.3.7 to hold the
; C3 image under its 1.3 MB slot; we don't depend on that here.)
platform = espressif32
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200

[env:esp32dev]
board = esp32dev

[env:c3]
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp8266]
platform = espressif8266@4.2.1   ; pinned: the ESP8266 image must stay reproducible
framework = arduino
board = nodemcuv2
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m2m.ld   ; 2 MB FS: a 128k-domain list (642 KB) must fit live + staged
board_upload.maximum_size = 1044464
monitor_speed = 115200
build_flags =
    -DINDEX_ENTRIES=1024
    -DCACHE_SIZE=64
    -DMAX_RANGE=256
    -DMAX_CLIENTS=32
    -DMAX_CUSTOM=50
